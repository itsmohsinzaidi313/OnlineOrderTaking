services:
  
  website:
    build:
      context: ./nextjs
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    networks:
      - patroni-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  pushnotificationservice:
    build:
      context: .
      dockerfile: ./PushNotificationService/Dockerfile
    ports:
      - "8080"
    environment:
      - REDIS__CONNECTIONSTRING=${REDIS_HOST}:${REDIS_PORT},password=${REDIS_PASSWORD},abortConnect=false
      - VAPID__SUBJECT=${VAPID_SUBJECT}
      - VAPID__PUBLICKEY=${VAPID_PUBLIC_KEY}
      - VAPID__PRIVATEKEY=${VAPID_PRIVATE_KEY}
      - RABBITMQ__HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
    networks:
      - patroni-net
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  customerorderhistoryservice:
    build:
      context: .
      dockerfile: ./CustomerOrderHistoryService/Dockerfile
    environment:
      - ConnectionStrings__Postgres=${ROSQLCONNECTION}
      - RABBITMQ__HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
    networks:
      - patroni-net
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  menuservice:
    build:
      context: .
      dockerfile: ./MenuService/Dockerfile
    environment:
      - ConnectionStrings__Postgres=${ROSQLCONNECTION}
      - RABBITMQ__HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
    networks:
      - patroni-net
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orderhistoryservice:
    build:
      context: .
      dockerfile: ./OrderHistoryService/Dockerfile
    ports:
      - "8080"
    environment:
      - ConnectionStrings__Postgres=${ROSQLCONNECTION}
      - RABBITMQ__HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
    networks:
      - patroni-net
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  settingsdataservice:
    build:
      context: .
      dockerfile: ./SettingsDataService/Dockerfile
    environment:
      - ConnectionStrings__Postgres=${ROSQLCONNECTION}
      - RABBITMQ__HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
    networks:
      - patroni-net
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  clientnotifyservice:
    build:
      context: .
      dockerfile: ./ClientNotificationService/Dockerfile
    environment:
      - ConnectionStrings__Postgres=${ROSQLCONNECTION}
      - RABBITMQ__HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
    networks:
      - patroni-net
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orderupdateservice:
    build:
      context: .
      dockerfile: ./OrderUpdateService/Dockerfile
    environment:
      - ConnectionStrings__Postgres=${ROSQLCONNECTION}
      - RABBITMQ__HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
    networks:
      - patroni-net
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  importservice:
    build:
      context: .
      dockerfile: ./ImportService/Dockerfile
    environment:
      - ConnectionStrings__SqlServer=${MSSQLCONNECTION}
      - ConnectionStrings__Postgres=${RWSQLCONNECTION}
    networks:
      - patroni-net
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  createorderservice:
    build:
      context: .
      dockerfile: ./CreateOrderService/Dockerfile
    environment:
      - ConnectionStrings__Postgres=${RWSQLCONNECTION}
      - ConnectionStrings__Redis=${REDIS_HOST}:${REDIS_PORT},password=${REDIS_PASSWORD},abortConnect=false
      - RABBITMQ__HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
    networks:
      - patroni-net
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gatewayservice:
    build:
      context: .
      dockerfile: ./GatewayService/Dockerfile
    ports:
      - "8090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${GATEWAY_ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${GATEWAY_ASPNETCORE_URLS}
      - REDIS__CONNECTIONSTRING=${REDIS_HOST}:${REDIS_PORT},password=${REDIS_PASSWORD},abortConnect=false
      - RABBITMQ__HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - JWT__KEY=${GATEWAY_JWT_KEY}
      - JWT__ISSUER=${GATEWAY_JWT_ISSUER}
      - JWT__AUDIENCE=${GATEWAY_JWT_AUDIENCE}
      - JWT__EXPIREMINUTES=${GATEWAY_JWT_EXPIREMINUTES}
    networks:
      - patroni-net
    depends_on:
      rabbitmq:
        condition: service_healthy
  
  # etcd for Patroni configuration management
  etcd:
    build:
      context: ./etcd
      dockerfile: Dockerfile
    container_name: etcd
    environment:
      - ETCD_NAME=${ETCD_NAME}
      - ETCD_DATA_DIR=${ETCD_DATA_DIR}
      - ETCD_LISTEN_CLIENT_URLS=${ETCD_LISTEN_CLIENT_URLS}
      - ETCD_LISTEN_PEER_URLS=${ETCD_LISTEN_PEER_URLS}
      - ETCD_ADVERTISE_CLIENT_URLS=${ETCD_ADVERTISE_CLIENT_URLS}
    volumes:
      - etcd_data:/etcd-data
    networks:
      - patroni-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--dial-timeout=5s", "--command-timeout=5s"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Patroni Node 1
  patroni1:
    build:
      context: ./patroni-docker
      dockerfile: Dockerfile
    container_name: patroni1
    hostname: patroni1
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      PGDATA: "${PGDATA}"
      PATRONI_SCOPE: "${PATRONI_SCOPE}"
      PATRONI_NAME: "${PATRONI_NAME}"
      PATRONI_NAMESPACE: "${PATRONI_NAMESPACE}"
      PATRONI_ETCD3_HOSTS: "${PATRONI_ETCD3_HOSTS}"
      PATRONI_RESTAPI_LISTEN: "${PATRONI_RESTAPI_LISTEN}"
      PATRONI_RESTAPI_CONNECT_ADDRESS: "${PATRONI_RESTAPI_CONNECT_ADDRESS}"
      PATRONI_POSTGRESQL_LISTEN: "${PATRONI_POSTGRESQL_LISTEN}"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "${PATRONI_POSTGRESQL_CONNECT_ADDRESS}"
      PATRONI_POSTGRESQL_DATA_DIR: "${PATRONI_POSTGRESQL_DATA_DIR}"
      PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME: "${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME}"
      PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD: "${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD}"
      PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_USERNAME: "${PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_USERNAME}"
      PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD: "${PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD}"
    volumes:
      - /home/userone/patroni_storage/patroni1:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - patroni-net
    depends_on:
      - etcd

  # Patroni Node 2  
  patroni2:
    build:
      context: ./patroni-docker
      dockerfile: Dockerfile
    container_name: patroni2
    hostname: patroni2
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      PGDATA: "${PGDATA}"
      PATRONI_SCOPE: "${PATRONI_SCOPE}"
      PATRONI_NAME: "patroni2"
      PATRONI_NAMESPACE: "${PATRONI_NAMESPACE}"
      PATRONI_ETCD3_HOSTS: "${PATRONI_ETCD3_HOSTS}"
      PATRONI_RESTAPI_LISTEN: "${PATRONI_RESTAPI_LISTEN}"
      PATRONI_RESTAPI_CONNECT_ADDRESS: "patroni2:8008"
      PATRONI_POSTGRESQL_LISTEN: "${PATRONI_POSTGRESQL_LISTEN}"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "patroni2:5433"
      PATRONI_POSTGRESQL_DATA_DIR: "${PATRONI_POSTGRESQL_DATA_DIR}"
      PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME: "${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME}"
      PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD: "${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD}"
      PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_USERNAME: "${PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_USERNAME}"
      PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD: "${PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD}"
    volumes:
      - /home/userone/patroni_storage/patroni2:/var/lib/postgresql/data
    networks:
      - patroni-net
    depends_on:
      - etcd
      - patroni1

  # Patroni Node 3
  patroni3:
    build:
      context: ./patroni-docker
      dockerfile: Dockerfile
    container_name: patroni3
    hostname: patroni3
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      PGDATA: "${PGDATA}"
      PATRONI_SCOPE: "${PATRONI_SCOPE}"
      PATRONI_NAME: "patroni3"
      PATRONI_NAMESPACE: "${PATRONI_NAMESPACE}"
      PATRONI_ETCD3_HOSTS: "${PATRONI_ETCD3_HOSTS}"
      PATRONI_RESTAPI_LISTEN: "${PATRONI_RESTAPI_LISTEN}"
      PATRONI_RESTAPI_CONNECT_ADDRESS: "patroni3:8008"
      PATRONI_POSTGRESQL_LISTEN: "${PATRONI_POSTGRESQL_LISTEN}"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "patroni3:5433"
      PATRONI_POSTGRESQL_DATA_DIR: "${PATRONI_POSTGRESQL_DATA_DIR}"
      PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME: "${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME}"
      PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD: "${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD}"
      PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_USERNAME: "${PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_USERNAME}"
      PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD: "${PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD}"
    volumes:
      - /home/userone/patroni_storage/patroni3:/var/lib/postgresql/data
    networks:
      - patroni-net
    depends_on:
      - etcd
      - patroni1

  # HAProxy for load balancing
  haproxy:
    build:
      context: ./haproxy
      dockerfile: Dockerfile
    container_name: haproxy
    ports:
      - "127.0.0.1:${HAPROXY_PORT_PRIMARY}:${HAPROXY_PORT_PRIMARY}"   # PostgreSQL (host port primary -> container primary)
      - "127.0.0.1:${HAPROXY_PORT_REPLICA}:${HAPROXY_PORT_REPLICA}"   # PostgreSQL read-only frontend (host replica -> container replica)
      - "127.0.0.1:${HAPROXY_STATS_PORT}:${HAPROXY_STATS_PORT}"   # HAProxy stats
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - patroni-net
    depends_on:
      - patroni1
      - patroni2
      - patroni3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${HAPROXY_STATS_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - patroni-net

  # RabbitMQ broker with management UI
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - patroni-net

volumes:
  etcd_data:
  redis_data:
  rabbitmq_data:

networks:
  patroni-net:
    driver: bridge