<!DOCTYPE html>
<html>

<body>
  <div style="margin-bottom:12px; display:flex; gap:12px; align-items:center;">
    <button id="send">Send Menu Request</button>

    <!-- Button to check token expiry and attempt refresh if needed -->
    <button id="checkToken">Check / Refresh Token</button>

    <!-- Button to clear stored token and fetch a new one -->
    <button id="clearToken">Clear Token & Get New</button>

    <!-- Manual reconnect/update-token button -->
    <button id="reconnect">Reconnect / Update Token</button>

    <!-- SignalR connectivity indicator -->
    <div id="signalrIndicator" style="display:flex; gap:8px; align-items:center;">
      <div id="signalrBox" style="width:18px; height:18px; border-radius:4px; background:#ccc; border:1px solid #999">
      </div>
      <div id="signalrText" style="font-family:Arial,Helvetica,sans-serif; font-size:13px; color:#333">Not connected
      </div>
    </div>
  </div>

  <br />
  <!-- Read-only fixed-size text box for the last Response payload -->
  <label for="payloadBox">Last Response Payload:</label><br />
  <textarea id="payloadBox" readonly
    style="width:600px; height:200px; resize:vertical; white-space:pre; overflow:auto;"></textarea>
  <br />
  <button id="clear">Clear Last Response</button>
  <pre id="log"></pre>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <script>
    const SERVER_URL = "http://85.190.242.39";
    const SERVER_PORT = 8090;

    let currentToken = null; // tracked and updated when refreshed
    let conn = null; // current HubConnection reference

    // Log helper: prepend messages so newest appear first (descending order)
    const log = (m) => {
      try {
        const el = document.getElementById('log');
        if (!el) return;
        // Prepend the new message followed by a newline, keeping existing content below
        el.textContent = m + "\n" + el.textContent;
      } catch (e) {
        // ignore UI errors
      }
    };

    // Fetch JWT token from the server
    async function fetchJwtToken(username, password) {
      try {
        var userId = localStorage.getItem('userId') || createRandomUserId();
        localStorage.setItem('userId', userId);
        const response = await fetch(
          `${SERVER_URL}:${SERVER_PORT}/generate-token`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password, userId }),
          }
        );

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        const t = data.token; // Assuming the token is in the `token` field
        const rt = data.refreshToken || data.refresh_token || null;
        if (t) setStoredToken(t, rt);
        return t;
      } catch (error) {
        log("Failed to fetch JWT token: " + error);
        throw error;
      }
    }

    function createRandomUserId() {
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let part1 = "";
      let part2 = "";

      for (let i = 0; i < 4; i++) {
        part1 += chars[Math.floor(Math.random() * chars.length)];
        part2 += chars[Math.floor(Math.random() * chars.length)];
      }

      return part1 + "-" + part2;
    }


    // Attempt to refresh the token using /refresh-token endpoint.
    // Assumption: POST /refresh-token accepts Authorization: Bearer <currentToken>
    // and returns { token: "new-token" } on success.
    async function fetchRefreshToken(oldToken) {
      // Retry with exponential backoff in case of transient failures
      const maxRetries = 3;
      let attempt = 0;
      const refreshToken = getStoredRefreshToken();

      while (attempt < maxRetries) {
        try {
          const opts = {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${oldToken}` },
          };

          // If a refresh token is stored, send it in the body as well (supports servers that expect it)
          if (refreshToken) {
            opts.body = JSON.stringify({ refreshToken });
          }

          const response = await fetch(`${SERVER_URL}:${SERVER_PORT}/refresh-token`, opts);
          if (!response.ok) {
            throw new Error(`Refresh failed: ${response.status}`);
          }
          const data = await response.json();
          const t = data.token;
          const rt = data.refreshToken || data.refresh_token || null;
          if (t) setStoredToken(t, rt);
          return t;
        } catch (error) {
          attempt += 1;
          log(`Failed to refresh token (attempt ${attempt}): ${error}`);
          if (attempt >= maxRetries) {
            log('Max refresh attempts reached');
            throw error;
          }
          // exponential backoff (ms)
          const delay = 500 * Math.pow(2, attempt - 1);
          await new Promise((res) => setTimeout(res, delay));
        }
      }
      return null;
    }

    // localStorage helpers for token persistence (cross-tab)
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
          Array.prototype.map
            .call(atob(base64), function (c) {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            })
            .join('')
        );
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    function setStoredToken(t, refreshToken) {
      try {
        currentToken = t;
        if (t) {
          localStorage.setItem('jwt_token', t);
          const payload = parseJwt(t);
          if (payload && payload.exp) {
            // store expiry as ms since epoch
            localStorage.setItem('jwt_exp', String(payload.exp * 1000));
          } else {
            localStorage.removeItem('jwt_exp');
          }
        } else {
          localStorage.removeItem('jwt_token');
          localStorage.removeItem('jwt_exp');
        }
        if (refreshToken) {
          localStorage.setItem('refresh_token', refreshToken);
        }
      } catch (e) {
        // ignore storage errors
      }
    }

    function getStoredToken() {
      try {
        return localStorage.getItem('jwt_token');
      } catch (e) {
        return null;
      }
    }

    function getStoredTokenExpiry() {
      try {
        const v = localStorage.getItem('jwt_exp');
        return v ? parseInt(v, 10) : null;
      } catch (e) {
        return null;
      }
    }

    function getStoredRefreshToken() {
      try {
        return localStorage.getItem('refresh_token');
      } catch (e) {
        return null;
      }
    }

    // Build a connection using the currentToken variable so it can be
    // updated dynamically when refreshed.
    function buildConnection() {
      const builder = new signalR.HubConnectionBuilder().withAutomaticReconnect();
      const urlWithToken = `${SERVER_URL}:${SERVER_PORT}/gatewayHub?access_token=${encodeURIComponent(
        currentToken || ""
      )}`;
      const headers = currentToken ? { Authorization: `Bearer ${currentToken}` } : {};
      builder.withUrl(urlWithToken, {
        accessTokenFactory: () => currentToken,
        headers,
      });
      return builder.build();
    }

    function setupCommonHandlers(connection) {
      connection.on("Ack", (ack) => log("Ack: " + JSON.stringify(ack)));
      connection.on("MenuResponse", (payload) => {
        // keep the existing log entry
        log("Response: " + JSON.stringify(payload));
        // also show the payload in the readonly textarea as pretty JSON (or raw string)
        try {
          const el = document.getElementById('payloadBox');
          if (el) {
            const text = typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2);
            el.value = text;
          }
        } catch (e) {
          // ignore errors updating the UI
        }
      });

      // SignalR lifecycle handlers to update the UI indicator
      try {
        connection.onreconnecting(() => {
          updateSignalrIndicator('Reconnecting', '#f39c12');
          log('SignalR: reconnecting');
        });
        connection.onreconnected(() => {
          updateSignalrIndicator('Connected', '#28a745');
          log('SignalR: reconnected');
        });
        connection.onclose(() => {
          updateSignalrIndicator('Disconnected', '#dc3545');
          log('SignalR: closed');
        });
      } catch (e) {
        // older SignalR builds may not expose these handlers reliably; ignore
      }
    }

    // Update the small colored box and text to indicate SignalR status
    function updateSignalrIndicator(text, color) {
      try {
        const box = document.getElementById('signalrBox');
        const txt = document.getElementById('signalrText');
        if (box) box.style.background = color || '#ccc';
        if (txt) txt.textContent = text || '';
      } catch (e) {
        // ignore UI errors
      }
    }

    // Wrapper to invoke SendRequest and refresh token + reconnect on 401/Unauthorized
    async function menuRequest() {
      if (!conn) {
        throw new Error("No connection available");
      }
      try {
        await conn.invoke("MenuRequest");
      } catch (err) {
        const msg = err && err.toString ? err.toString() : String(err);
        log("Send error: " + msg);
        if (msg.includes("401") || /unauthor/i.test(msg)) {
          log("Unauthorized detected, attempting token refresh...");
          try {
            const newToken = await fetchRefreshToken(currentToken);
            if (!newToken) throw new Error("No token returned by refresh endpoint");
            currentToken = newToken;
            log("Token refreshed successfully");

            // stop old connection and create a new one with refreshed token
            try { await conn.stop(); } catch (stopErr) { /* ignore */ }
            conn = buildConnection();
            setupCommonHandlers(conn);
            await conn.start();
            log("Reconnected with refreshed token");

            // retry original request
            await conn.invoke("MenuRequest", route, JSON.stringify(payload));
            log("Retried request after refresh: success");
          } catch (refreshErr) {
            log("Token refresh/retry failed: " + refreshErr);
            throw refreshErr;
          }
        } else {
          throw err;
        }
      }
    }

    function setupSendHandler() {
      document.getElementById("send").onclick = () => {
        // use the wrapper which handles refresh/retry
        menuRequest().catch((e) => log("Final send error: " + e));
      };
      // clear button: clear the readonly payload textbox (last response)
      const clearBtn = document.getElementById('clear');
      if (clearBtn) {
        clearBtn.onclick = () => {
          try {
            const el = document.getElementById('payloadBox');
            if (el) el.value = '';
            log('Cleared last response');
          } catch (e) {
            // ignore UI errors
          }
        };
      }

      // Reconnect button: manual attempt to refresh token or get a new one and reconnect
      const reconnectBtn = document.getElementById('reconnect');
      if (reconnectBtn) {
        reconnectBtn.onclick = async () => {
          try {
            log('Manual reconnect triggered');
            const stored = getStoredToken();
            let newToken = null;

            // Try refresh first if we have a token
            if (stored) {
              newToken = await fetchRefreshToken(stored).catch((e) => {
                log('Manual refresh attempt failed: ' + e);
                return null;
              });
              if (newToken) {
                currentToken = newToken;
                log('Token refreshed successfully (manual reconnect)');
              }
            }

            // If refresh didn't work, attempt to fetch a fresh token using credentials
            if (!newToken) {
              log('Attempting to fetch a new token (manual reconnect)');
              newToken = await fetchJwtToken('admin', 'password').catch((e) => {
                log('Manual fetch new token failed: ' + e);
                return null;
              });
              if (newToken) {
                currentToken = newToken;
                log('Fetched new token (manual reconnect)');
              }
            }

            // Rebuild and restart connection regardless (will include currentToken or none)
            try { if (conn) await conn.stop(); } catch (e) { /* ignore */ }
            conn = buildConnection();
            setupCommonHandlers(conn);
            await conn.start();
            updateSignalrIndicator('Connected', '#28a745');
            log('Reconnected (manual) to GatewayHub');
          } catch (e) {
            log('Manual reconnect failed: ' + e);
          }
        };
      }

      // Check token button: inspect expiry and attempt refresh if expired
      const checkBtn = document.getElementById('checkToken');
      if (checkBtn) {
        checkBtn.onclick = async () => {
          try {
            const token = getStoredToken();
            if (!token) {
              log('No token in localStorage. Fetching new token...');
              const t = await fetchJwtToken('admin', 'password');
              currentToken = t;
              log('Obtained new token');
              // reconnect with new token
              try { if (conn) await conn.stop(); } catch (e) { }
              conn = buildConnection();
              setupCommonHandlers(conn);
              await conn.start();
              updateSignalrIndicator('Connected', '#28a745');
              return;
            }

            const payload = parseJwt(token);
            if (!payload || !payload.exp) {
              log('Token present but could not parse expiry. Attempting refresh...');
              const refreshed = await fetchRefreshToken(token).catch(e => null);
              if (refreshed) {
                currentToken = refreshed;
                log('Token refreshed successfully');
              } else {
                log('Refresh failed or not supported');
              }
              return;
            }

            const expMs = payload.exp * 1000;
            const now = Date.now();
            if (expMs <= now) {
              log('Token has expired. Attempting to refresh...');
              const newT = await fetchRefreshToken(token).catch(e => null);
              if (newT) {
                currentToken = newT;
                log('Refresh successful');
                // reconnect with refreshed token
                try { if (conn) await conn.stop(); } catch (e) { }
                conn = buildConnection();
                setupCommonHandlers(conn);
                await conn.start();
                updateSignalrIndicator('Connected', '#28a745');
              } else {
                log('Refresh failed; you may need to login again');
              }
            } else {
              const secondsLeft = Math.round((expMs - now) / 1000);
              log('Token valid, expires in ' + secondsLeft + 's');
            }
          } catch (e) {
            log('Error checking token: ' + e);
          }
        };
      }

      // Clear token button: remove tokens and fetch a fresh one
      const clearTokenBtn = document.getElementById('clearToken');
      if (clearTokenBtn) {
        clearTokenBtn.onclick = async () => {
          try {
            setStoredToken(null, null);
            log('Cleared stored token and refresh token');
            // stop existing connection
            try { if (conn) await conn.stop(); } catch (e) { }
            currentToken = null;
            updateSignalrIndicator('Disconnected', '#dc3545');
            // fetch a new token (uses default credentials used elsewhere)
            const newT = await fetchJwtToken('admin', 'password').catch(e => null);
            if (newT) {
              currentToken = newT;
              log('Fetched new token after clear');
              conn = buildConnection();
              setupCommonHandlers(conn);
              await conn.start();
              updateSignalrIndicator('Connected', '#28a745');
              log('Reconnected with new token');
            } else {
              log('Failed to fetch a new token');
            }
          } catch (e) {
            log('Error clearing/getting new token: ' + e);
          }
        };
      }
    }

    // Start: fetch token and connect. If start fails due to 401, attempt refresh.
    async function start() {
      try {
        // show connecting state immediately
        updateSignalrIndicator('Connecting', '#f39c12');
        const username = "admin";
        const password = "password";

        // Try to reuse token from localStorage first
        const stored = getStoredToken();
        if (stored) {
          currentToken = stored;
          log("Loaded JWT token from localStorage");

          // proactively refresh if token expires within the next 60s
          const exp = getStoredTokenExpiry();
          if (exp && exp - Date.now() < 60 * 1000) {
            log('Token expiring soon, attempting proactive refresh...');
            try {
              const newT = await fetchRefreshToken(currentToken);
              if (newT) {
                currentToken = newT;
                log('Proactive refresh successful');
              }
            } catch (e) {
              log('Proactive refresh failed: ' + e);
            }
          }
        } else {
          currentToken = await fetchJwtToken(username, password);
          log("Fetched JWT token successfully");
        }

        conn = buildConnection();
        setupCommonHandlers(conn);
        try {
          await conn.start();
          log("Connected (authenticated) to GatewayHub");
          updateSignalrIndicator('Connected', '#28a745');
        } catch (startErr) {
          const msg = startErr && startErr.toString ? startErr.toString() : String(startErr);
          log("Connection start failed: " + msg);
          if (msg.includes("401") || /unauthor/i.test(msg)) {
            log("Unauthorized on start, attempting token refresh...");
            currentToken = await fetchRefreshToken(currentToken);
            log("Token refreshed, retrying connection");
            conn = buildConnection();
            setupCommonHandlers(conn);
            await conn.start();
            log("Connected after refresh");
            updateSignalrIndicator('Connected', '#28a745');
          } else {
            throw startErr;
          }
        }

        setupSendHandler();
      } catch (error) {
        log("Failed to start connection: " + error);
        updateSignalrIndicator('Disconnected', '#dc3545');
      }
    }

    // Disconnect SignalR connection when the page is about to unload
    window.onbeforeunload = async () => {
      if (conn) {
        try {
          await conn.stop();
          log('SignalR connection stopped on page unload');
        } catch (e) {
          log('Error stopping SignalR connection on unload: ' + e);
        }
      }
    };

    // Kick off
    start().catch((err) => log("Connect error: " + err.toString()));
  </script>
</body>

</html>
