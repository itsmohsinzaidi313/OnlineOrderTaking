<!doctype html>
<html>
  <body>
    <button id="send">Send Menu Request</button>
    <pre id="log"></pre>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script>
      const log = (m) => document.getElementById('log').textContent += m + "\n";
      const connection = new signalR.HubConnectionBuilder()
        .withUrl("http://85.190.242.39:8090/gatewayHub")
        .withAutomaticReconnect()
        .build();

      connection.on("Ack", (ack) => log("Ack: " + JSON.stringify(ack)));
      connection.on("Response", (payload) => log("Response: " + JSON.stringify(payload)));

      connection.start().then(() => {
        log("Connected to GatewayHub");
        document.getElementById('send').onclick = () => {
          const route = "menu.get";
          const payload = { category: "all" };
          connection.invoke("SendRequest", route, JSON.stringify(payload))
            .catch(err => log("Send error: " + err.toString()));
        };
      }).catch(err => log("Connect error: " + err.toString()));
    </script>
  </body>
</html>
