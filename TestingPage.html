<!doctype html>
<html>

<body>
  <button id="send">Send Menu Request</button>
  <pre id="log"></pre>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <script>
    const log = (m) => document.getElementById('log').textContent += m + "\n";

    // Simple fetch wrapper that adds Authorization header when token is available
    let jwtToken = null;
    const authFetch = (url, opts = {}) => {
      opts.headers = opts.headers || {};
      if (jwtToken) opts.headers['Authorization'] = 'Bearer ' + jwtToken;
      return fetch(url, opts);
    };

    // Try loading token from sessionStorage only
    async function loadTokenFromStorageOrFile() {
      try {
        const s = sessionStorage.getItem('jwtToken');
        if (s) {
          jwtToken = s;
          log('Loaded JWT from sessionStorage');
        }
      } catch (e) {
        log('sessionStorage read failed: ' + e);
      }
    }

    // Build a connection; when token is provided, use accessTokenFactory
    function buildConnection(token) {
      const builder = new signalR.HubConnectionBuilder().withAutomaticReconnect();
      if (token) {
        builder.withUrl("http://85.190.242.39:8090/gatewayHub", { accessTokenFactory: () => token });
      } else {
        builder.withUrl("http://85.190.242.39:8090/gatewayHub");
      }
      return builder.build();
    }

    function setupCommonHandlers(conn) {
      conn.on("Ack", (ack) => log("Ack: " + JSON.stringify(ack)));
      conn.on("Response", (payload) => log("Response: " + JSON.stringify(payload)));
      conn.on("JwtTokenResponse", async (payload) => {
        log("JwtTokenResponse: " + JSON.stringify(payload));
        try {
          const token = typeof payload === 'string' ? payload : (payload?.token ?? payload?.jwt ?? payload?.accessToken ?? null);
          if (!token) return;
          // save token and persist
          jwtToken = token;
          try { sessionStorage.setItem('jwtToken', token); log('Saved JWT to sessionStorage'); } catch (e) { log('Failed to save JWT to sessionStorage: ' + e); }

          // if current connection is anonymous, reconnect with token
          if (conn && conn.state === signalR.HubConnectionState.Connected) {
            try {
              await conn.stop();
              log('Stopped anonymous connection; reconnecting with JWT token...');
            } catch (e) { log('Error stopping connection: ' + e); }

            const authConn = buildConnection(jwtToken);
            setupCommonHandlers(authConn);
            await authConn.start();
            log('Connected (authenticated) to GatewayHub');
            setupSendHandler(authConn);
          }
        } catch (e) {
          log('Failed to parse or handle JWT response: ' + e);
        }
      });
    }

    function setupSendHandler(conn) {
      document.getElementById('send').onclick = () => {
        const route = "menu.get";
        const payload = { category: "all" };
        conn.invoke("SendRequest", route, JSON.stringify(payload))
          .catch(err => log("Send error: " + err.toString()));
      };
    }

    // Start: load token (from sessionStorage or token.txt). If token exists, connect authenticated.
    async function start() {
      await loadTokenFromStorageOrFile();

      if (jwtToken) {
        // connect authenticated immediately
        const conn = buildConnection(jwtToken);
        setupCommonHandlers(conn);
        await conn.start();
        log('Connected (authenticated) to GatewayHub');
        setupSendHandler(conn);
        return;
      }

      // No token: start anonymous connection and request a token
      const conn = buildConnection(null);
      setupCommonHandlers(conn);
      await conn.start();
      log('Connected (anonymous) to GatewayHub');

      // Request a token for a user id (change 'user1' as needed)
      const requestedUserId = 'user1';
      try {
        await conn.invoke('RequestJwtToken', requestedUserId);
        log(`Requested JWT for user ${requestedUserId}. Waiting for JwtTokenResponse...`);
      } catch (e) {
        log('RequestJwtToken invoke failed: ' + e);
      }

      // If JwtTokenResponse doesn't arrive, keep anonymous connection (handlers above will perform reconnect when token comes)
      setupSendHandler(conn);
    }

    // Kick off
    start().catch(err => log('Connect error: ' + err.toString()));
  </script>
</body>

</html>
