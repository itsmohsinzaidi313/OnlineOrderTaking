name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-transfer:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application services
        run: |
          echo "Building application services..."
          # List available services first
          echo "Available services in docker-compose:"
          docker compose config --services
          
          # Build only application services
          docker compose build \
            exportservice generalseodataservice pushnotificationservice \
            customerorderhistoryservice menuservice orderhistoryservice \
            settingsdataservice clientnotifyservice orderupdateservice \
            importservice createorderservice gatewayservice
          
          # Verify images were built
          echo "Built images:"
          docker images | grep -E "exportservice|gatewayservice|menuservice"
          
          # Create images directory
          mkdir -p docker-images
          
          # Save images with proper names
          echo "Saving images..."
          
          # Get actual image names from docker compose
          docker compose config --images | grep -v "redis\|rabbitmq\|patroni\|etcd\|haproxy" | while read image; do
            if [ ! -z "$image" ] && [ "$image" != "null" ]; then
              name=$(echo $image | sed 's/.*_//' | sed 's/:.*//')
              echo "Saving $image as $name..."
              docker save "$image" | gzip > "docker-images/${name}.tar.gz"
            fi
          done
          
          # Also try alternative method if above fails
          echo "Alternative save method..."
          for service in exportservice generalseodataservice pushnotificationservice \
                         customerorderhistoryservice menuservice orderhistoryservice \
                         settingsdataservice clientnotifyservice orderupdateservice \
                         importservice createorderservice gatewayservice; do
            if docker images | grep -q "$service"; then
              echo "Saving $service..."
              docker save "$service:latest" | gzip > "docker-images/${service}.tar.gz" 2>/dev/null || \
              docker save "onlineordertaking_$service:latest" | gzip > "docker-images/${service}.tar.gz" 2>/dev/null || \
              echo "Could not save $service"
            else
              echo "Warning: $service image not found"
            fi
          done
          
          # List saved images
          echo "Saved images:"
          ls -la docker-images/ || echo "No images saved"

      - name: Upload debug info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: docker-images/
          retention-days: 1

      - name: Transfer to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-images/*.tar.gz,docker-compose.yml"
          target: "/home/${{ secrets.VPS_USERNAME }}/OnlineOrderTaking/"
          strip_components: 1

  deploy:
    needs: build-and-transfer
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: false
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/OnlineOrderTaking
            
            # Debug: Check what files were transferred
            echo "=== Debug: Checking transferred files ==="
            ls -la
            ls -la docker-images/ 2>/dev/null || echo "No docker-images directory"
            
            # Function to check if service is running
            service_running() {
              docker ps --format "table {{.Names}}" | grep -q "^$1$"
            }
            
            echo "🔍 Checking infrastructure services..."
            INFRA_SERVICES="patroni1 patroni2 patroni3 etcd haproxy rabbitmq redis redis-commander"
            
            for service in $INFRA_SERVICES; do
              if service_running "$service"; then
                echo "  ✅ $service is running"
              else
                echo "  ❌ $service is not running"
              fi
            done
            
            # Load application images if they exist
            echo "📦 Loading application Docker images..."
            if [ -d "docker-images" ] && [ "$(ls -A docker-images/*.tar.gz 2>/dev/null)" ]; then
              for image in docker-images/*.tar.gz; do
                if [ -f "$image" ]; then
                  echo "  Loading $(basename $image)..."
                  gunzip -c "$image" | docker load || echo "  Failed to load $image"
                fi
              done
            else
              echo "  ⚠️  No image files found to load"
              echo "  This might be the first deployment or build failed"
            fi
            
            # Stop only application services that are running
            echo "🛑 Stopping application services..."
            APP_SERVICES="exportservice generalseodataservice pushnotificationservice \
              customerorderhistoryservice menuservice orderhistoryservice \
              settingsdataservice clientnotifyservice orderupdateservice \
              importservice createorderservice gatewayservice"
            
            for service in $APP_SERVICES; do
              if service_running "$service"; then
                echo "  Stopping $service..."
                docker stop "$service" 2>/dev/null || true
                docker rm "$service" 2>/dev/null || true
              fi
            done
            
            # Start application services
            echo "🚀 Starting application services..."
            docker compose up -d \
              exportservice generalseodataservice pushnotificationservice \
              customerorderhistoryservice menuservice orderhistoryservice \
              settingsdataservice clientnotifyservice orderupdateservice \
              importservice createorderservice gatewayservice 2>&1 || echo "Some services failed to start"
            
            # Handle website
            echo "🌐 Updating website..."
            if [ -d "nextjs/web-ordering/.git" ]; then
              cd nextjs/web-ordering
              echo "  Pulling latest website code..."
              git pull origin main || echo "Git pull failed"
              cd ../..
            else
              echo "  Cloning website repository..."
              rm -rf nextjs/web-ordering
              mkdir -p nextjs
              cd nextjs
              git clone https://github.com/Samad-Developer/web-ordering.git web-ordering || echo "Clone failed"
              cd ..
            fi
            
            # Build and start website
            echo "🏗️ Building website..."
            if service_running "website"; then
              echo "  Stopping existing website..."
              docker stop website 2>/dev/null || true
              docker rm website 2>/dev/null || true
            fi
            
            docker compose build website || echo "Website build failed"
            docker compose up -d website || echo "Website start failed"
            
            # Cleanup
            echo "🧹 Cleaning up..."
            rm -rf docker-images/ 2>/dev/null || true
            docker system prune -f 2>/dev/null || true
            
            # Show status
            echo ""
            echo "📊 Final Container Status:"
            docker compose ps
            
            echo ""
            echo "✅ Deployment completed!"