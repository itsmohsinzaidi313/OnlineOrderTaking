name: Parallel Deployment to Staging

on:
  pull_request:
    types: [closed]
    branches:
      - staging
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (or all)"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - exportservice
          - generalseodataservice
          - pushnotificationservice
          - customerorderhistoryservice
          - menuservice
          - orderhistoryservice
          - settingsdataservice
          - clientnotifyservice
          - orderupdateservice
          - importservice
          - createorderservice
          - gatewayservice
          - website
          - infrastructure
env:
  ENVIRONMENT: production

jobs:
  call-actions-workflow:
    runs-on: ubuntu-latest
    environment: ${{ env.ENVIRONMENT }}
    steps:
      - name: Transfer base files
        uses: ./.github/workflows/transfer-base-files.yml
        with:
          environment: ${{ env.ENVIRONMENT }}

  infrastructure:
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'infrastructure'
    steps:
      - name: Call infrastructure deployment workflow
        uses: ./.github/workflows/infrastructure-deployment.yml
        with:
          environment: ${{ env.ENVIRONMENT }}

  deploy-all-services:
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'all'
    steps:
      - name: Call service deployment workflow
        uses: ./.github/workflows/all-services-deployment.yml
        with:
          environment: ${{ env.ENVIRONMENT }}
  
  deploy-website:
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'website'
    steps:
      - name: Call website deployment workflow
        uses: ./.github/workflows/website-deployment.yml
        with:
          environment: ${{ env.ENVIRONMENT }}

  single-service-deployment:
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.service, 'service')
    steps:
      - name: Call single service deployment workflow
        uses: ./.github/workflows/single-service-deployment.yml
        with:
          service: ${{ github.event.inputs.service }}
          environment: ${{ env.ENVIRONMENT }}
  
