name: Parallel Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (or all)'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - exportservice
          - generalseodataservice
          - pushnotificationservice
          - customerorderhistoryservice
          - menuservice
          - orderhistoryservice
          - settingsdataservice
          - clientnotifyservice
          - orderupdateservice
          - importservice
          - createorderservice
          - gatewayservice
          - website

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  VPS_PORT: ${{ secrets.VPS_PORT }}

jobs:
  # Infrastructure - runs once
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy infrastructure services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            cd /home/${{ env.VPS_USERNAME }}/OnlineOrderTaking
            for service in etcd patroni1 patroni2 patroni3 haproxy rabbitmq redis redis-commander; do
              if ! docker ps | grep -q $service; then
                docker compose up -d $service
              fi
            done

  # Parallel build, transfer & deploy for all backend services
  deploy-services:
    runs-on: ubuntu-latest
    needs: infrastructure
    if: github.event.inputs.service == 'all' || github.event_name == 'push'
    strategy:
      matrix:
        service:
          - exportservice
          - generalseodataservice
          - pushnotificationservice
          - customerorderhistoryservice
          - menuservice
          - orderhistoryservice
          - settingsdataservice
          - clientnotifyservice
          - orderupdateservice
          - importservice
          - createorderservice
          - gatewayservice
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build ${{ matrix.service }}
        run: |
          docker compose build ${{ matrix.service }}
          mkdir -p images
          docker save ${{ matrix.service }}:latest | gzip > images/${{ matrix.service }}.tar.gz
      
      - name: Transfer ${{ matrix.service }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            rsync -avz --partial --progress -e "ssh -p ${{ env.VPS_PORT }}" \
              images/${{ matrix.service }}.tar.gz \
              ${{ env.VPS_USERNAME }}@${{ env.VPS_HOST }}:/home/${{ env.VPS_USERNAME }}/OnlineOrderTaking/images/
      
      - name: Deploy ${{ matrix.service }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            cd /home/${{ env.VPS_USERNAME }}/OnlineOrderTaking
            gunzip -c images/${{ matrix.service }}.tar.gz | docker load
            docker stop ${{ matrix.service }} 2>/dev/null || true
            docker rm ${{ matrix.service }} 2>/dev/null || true
            docker compose up -d ${{ matrix.service }}
            rm -rf images/

  # Website service (special handling - builds on VPS)
  website:
    runs-on: ubuntu-latest
    needs: infrastructure
    if: github.event.inputs.service == 'all' || github.event.inputs.service == 'website' || github.event_name == 'push'
    steps:
      - name: Deploy website
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            cd /home/${{ env.VPS_USERNAME }}/OnlineOrderTaking
            # Update or clone website repo
            if [ -d "nextjs/web-ordering/.git" ]; then
              cd nextjs/web-ordering && git pull origin main && cd ../..
            else
              mkdir -p nextjs && cd nextjs && git clone https://github.com/Samad-Developer/web-ordering.git web-ordering && cd ..
            fi
            # Build and restart website
            docker stop website 2>/dev/null || true
            docker rm website 2>/dev/null || true
            docker compose build website --no-cache
            docker compose up -d website

  # Single-service manual deployment (when specific service selected)
  single-service:
    runs-on: ubuntu-latest
    needs: infrastructure
    if: github.event.inputs.service != 'all' && github.event.inputs.service != 'website' && github.event.inputs.service != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build ${{ github.event.inputs.service }}
        run: |
          docker compose build ${{ github.event.inputs.service }}
          mkdir -p images
          docker save ${{ github.event.inputs.service }}:latest | gzip > images/${{ github.event.inputs.service }}.tar.gz
      
      - name: Transfer ${{ github.event.inputs.service }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          source: "images/${{ github.event.inputs.service }}.tar.gz"
          target: "/home/${{ env.VPS_USERNAME }}/OnlineOrderTaking/"
      
      - name: Deploy ${{ github.event.inputs.service }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            cd /home/${{ env.VPS_USERNAME }}/OnlineOrderTaking
            gunzip -c images/${{ github.event.inputs.service }}.tar.gz | docker load
            docker stop ${{ github.event.inputs.service }} 2>/dev/null || true
            docker rm ${{ github.event.inputs.service }} 2>/dev/null || true
            docker compose up -d ${{ github.event.inputs.service }}
            rm -rf images/

  # Final health check (only for full deployment)
  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-services, website]
    if: always() && (github.event.inputs.service == 'all' || github.event_name == 'push')
    steps:
      - name: Verify all services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            cd /home/${{ env.VPS_USERNAME }}/OnlineOrderTaking
            echo "=== Container Status ==="
            docker ps --format "table {{.Names}}\t{{.Status}}"
            echo ""
            curl -f http://localhost:8090/health && echo "✅ Gateway OK" || echo "⚠️ Gateway issue"
            curl -f http://localhost:3000/health && echo "✅ Website OK" || echo "⚠️ Website issue"