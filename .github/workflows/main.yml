name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend services
        run: |
          echo "Building backend services..."
          docker compose build --no-cache \
            exportservice generalseodataservice pushnotificationservice \
            customerorderhistoryservice menuservice orderhistoryservice \
            settingsdataservice clientnotifyservice orderupdateservice \
            importservice createorderservice gatewayservice etcd \
            patroni1 patroni2 patroni3 haproxy
          
          mkdir -p docker-images
          
          # Compress all backend images
          for service in exportservice generalseodataservice pushnotificationservice \
                         customerorderhistoryservice menuservice orderhistoryservice \
                         settingsdataservice clientnotifyservice orderupdateservice \
                         importservice createorderservice gatewayservice etcd \
                         patroni1 patroni2 patroni3 haproxy; do
            echo "Compressing $service..."
            docker save ${service}:latest | gzip > docker-images/${service}.tar.gz
          done

      - name: Transfer to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-images/*.tar.gz,docker-compose.yml,.env"
          target: "/home/${{ secrets.VPS_USERNAME }}/OnlineOrderTaking/"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/OnlineOrderTaking
            
            # Load environment variables
            set -a
            source .env
            set +a
            
            # Load backend images
            echo "📦 Loading backend Docker images..."
            for image in docker-images/*.tar.gz; do
              if [ -f "$image" ]; then
                echo "  Loading $(basename $image)..."
                gunzip -c "$image" | docker load
              fi
            done
            
            # Pull base images
            echo "📥 Pulling base images..."
            docker compose pull redis redis-commander rabbitmq
            
            # Start backend services
            echo "🚀 Starting backend services..."
            docker compose up -d \
              exportservice generalseodataservice pushnotificationservice \
              customerorderhistoryservice menuservice orderhistoryservice \
              settingsdataservice clientnotifyservice orderupdateservice \
              importservice createorderservice gatewayservice etcd \
              patroni1 patroni2 patroni3 haproxy redis redis-commander rabbitmq
            
            # Update website
            echo "🌐 Updating website..."
            if [ -d "nextjs/web-ordering" ]; then
              cd nextjs/web-ordering
              git pull origin main
              cd ../..
            else
              echo "❌ Website directory not found!"
              exit 1
            fi
            
            # Build and start website
            echo "🏗️ Building website..."
            docker compose build website
            
            echo "🔄 Restarting website..."
            docker compose up -d --no-deps website
            
            # Health check
            echo "🏥 Performing health check..."
            sleep 10
            if curl -f http://localhost:3000/health; then
              echo "✅ Website health check passed!"
            else
              echo "⚠️  Website health check failed, but service is running"
            fi
            
            # Cleanup
            echo "🧹 Cleaning up..."
            rm -rf docker-images/
            docker system prune -f
            
            # Show status
            echo ""
            echo "📊 Container Status:"
            docker compose ps
            
            echo ""
            echo "✅ Deployment completed successfully!"