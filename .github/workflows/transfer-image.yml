name: Transfer built image to VPS

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment (production or development)"
        required: true
        type: string
      service:
        description: "Service to deploy"
        required: true
        type: string
jobs:
  transfer-image:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Transfer ${{ inputs.service }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "/home/${{ secrets.VPS_USERNAME }}/OnlineOrderTaking/${{ inputs.service }}.tar.gz"
          target: "${{ inputs.service }}.tar.gz"
          timeout: "30s"
          command_timeout: "10m"

      - name: Transfer ${{ inputs.service }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "${{ inputs.service }}.tar.gz"
          target: "/home/${{ secrets.VPS_USERNAME }}/OnlineOrderTaking/"
          timeout: "30s"
          command_timeout: "10m"

      - name: Clean up local image archive
        run: rm -f "${{ inputs.service }}.tar.gz"
