name: Deploy built image to VPS

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment (production or development)"
        required: true
        type: string
      service:
        description: "Service to deploy"
        required: true
        type: string

jobs:
  deploy-image:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy ${{ inputs.service }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/OnlineOrderTaking
            docker compose stop ${{ inputs.service }} 2>/dev/null || true
            docker compose rm -f ${{ inputs.service }} 2>/dev/null || true
            docker image rm "onlineordertaking-${{ inputs.service }}" 2>/dev/null || true
            gunzip -c ${{ inputs.service }}.tar.gz | docker load 2>/dev/null || true
            docker compose up -d ${{ inputs.service }} --remove-orphans 2>/dev/null || true
            rm -f ${{ inputs.service }}.tar.gz 2>/dev/null || true
