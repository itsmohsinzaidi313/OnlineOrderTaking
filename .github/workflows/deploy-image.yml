name: Deploy built image to VPS

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment (production or development)"
        required: true
        type: string
      service:
        description: "Service to deploy"
        required: true
        type: string

jobs:
  deploy-image:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy ${{ inputs.service }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/OnlineOrderTaking
            git pull origin ${{ github.ref_name }}
            # Pull the latest images from your registry
            docker compose pull ${{ inputs.service }}

            # Recreate containers with the new images
            docker compose up -d --remove-orphans ${{ inputs.service }}
