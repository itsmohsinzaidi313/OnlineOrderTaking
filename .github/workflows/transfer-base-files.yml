name: Actions

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  transfer-base-files:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Transfer base files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "docker-compose.yml,website-compose.yml,.env"
          target: "/home/${{ secrets.VPS_USERNAME }}/OnlineOrderTaking/"
