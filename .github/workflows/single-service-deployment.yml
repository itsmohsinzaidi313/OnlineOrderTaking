name: Single service deployment

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (production or development)'
        required: true
        type: string
      service:
        description: 'Service to deploy'
        required: true
        type: string

jobs:
  single-service:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ${{ inputs.service }}
        run: |
          docker compose build ${{ inputs.service }}
          IMAGE_NAME=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "^((onlineordertaking-)?${{ inputs.service }}):" | head -1)
          if [ -z "$IMAGE_NAME" ]; then
            for candidate in "onlineordertaking-${{ inputs.service }}" "${{ inputs.service }}"; do
              if docker image inspect "$candidate" >/dev/null 2>&1; then
                IMAGE_NAME="$candidate"
                break
              fi
            done
          fi
          if [ -z "$IMAGE_NAME" ]; then
            echo "No image found for ${{ inputs.service }} after build."
            docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "${{ inputs.service }}|onlineordertaking-${{ inputs.service }}" || true
            exit 1
          fi
          echo "Saving image: $IMAGE_NAME"
          docker save "$IMAGE_NAME" | gzip > "${{ inputs.service }}.tar.gz"
          du -h "${{ inputs.service }}.tar.gz"

      - name: Transfer ${{ matrix.service }}
        uses: ./.github/workflows/transfer-image.yml
        with:
          environment: ${{ inputs.environment }}
          service: ${{ matrix.service }}

      - name: Deploy ${{ matrix.service }}
        uses: ./.github/workflows/deploy-image.yml
        with:
          environment: ${{ inputs.environment }}
          service: ${{ matrix.service }}