name: Build Image

on:
  workflow_call:
    inputs:
      service:
        description: "Service to build (or 'all' for all services)"
        required: true
        type: string
      environment:
        description: "Deployment environment (production or development)"
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: registry.eatx.pk
          username: "ygensystems"
          password: "$2y$05$o54NnejK7KomeBFAbQwgieJC7A0cXf7tPYDGYH5qEG7MnLs9CD01."

      - name: Restore .env
        run: |
          echo "${{ secrets.SERVICES_ENV }}" | base64 -d > .env

      - name: Build image
        run: docker compose -f docker-compose-ci.yml build ${{ inputs.service }}

      - name: Push image
        run: docker compose -f docker-compose-ci.yml push ${{ inputs.service }}
