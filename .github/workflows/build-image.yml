name: Build Image

on:
    workflow_call:
        inputs:
            service:
                description: "Service to build (or 'all' for all services)"
                required: true
                type: string
            environment:
                description: "Deployment environment (production or development)"
                required: true
                type: string

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to private registry
              uses: docker/login-action@v3
              with:
                  registry: registry.eatx.pk
                  username: "ygensystems"
                  password: "$2y$05$o54NnejK7KomeBFAbQwgieJC7A0cXf7tPYDGYH5qEG7MnLs9CD01."
            
            - name: Create .env file
              run: echo "${{ secrets.ENV_FILE_BASE64 }}" | base64 -d > .env

            - name: Build all images
              run: docker compose -f docker-compose-ci.yml build ${{ inputs.service }}

            - name: Push all images
              run: docker compose -f docker-compose-ci.yml push ${{ inputs.service }}

