name: All Services Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment (production or development)"
        required: true
        type: string

jobs:
  build-services:
    name: Build services in parallel for ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: registry.eatx.pk
          username: "ygensystems"
          password: "$2y$05$o54NnejK7KomeBFAbQwgieJC7A0cXf7tPYDGYH5qEG7MnLs9CD01."

      - name: Restore .env
        run: |
          echo "${{ secrets.SERVICES_ENV }}" | base64 -d > .env

      - name: Build all images
        run: docker compose -f docker-compose-ci.yml build

      - name: Push all images
        run: docker compose -f docker-compose-ci.yml push

  deploy-services:
    name: Deploy services in parallel to ${{ inputs.environment }}
    needs: build-services
    if: github.event.inputs.service == 'all' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy all services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/OnlineOrderTaking
            git pull
            # Pull the latest images from your registry
            docker compose -f docker-compose.yml pull

            # Recreate containers with the new images
            docker compose -f docker-compose.yml up -d --remove-orphans
