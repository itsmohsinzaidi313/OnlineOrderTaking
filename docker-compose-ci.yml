      - RABBITMQ__HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
    networks:
      - patroni-net
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orderupdateservice:
    build:
      context: .
      dockerfile: ./OrderUpdateService/Dockerfile
    image: registry.eatx.pk/online-order-taking/orderupdateservice:latest
    environment:
      - CONNECTIONSTRINGS__POSTGRES=${ROSQLCONNECTION}
      - RABBITMQ__HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
    networks:
      - patroni-net
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  importservice:
    build:
      context: .
      dockerfile: ./ImportService/Dockerfile
    image: registry.eatx.pk/online-order-taking/importservice:latest
    environment:
      - CONNECTIONSTRINGS__SQLSERVER=${MSSQLCONNECTION}
      - CONNECTIONSTRINGS__POSTGRES=${RWSQLCONNECTION}
    networks:
      - patroni-net
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  createorderservice:
    build:
      context: .
      dockerfile: ./CreateOrderService/Dockerfile
    image: registry.eatx.pk/online-order-taking/createorderservice:latest
    environment:
      - KESTREL__ENDPOINTS__GRPC__URL=http://createorderservice:${GRPC_PORT}
      - KESTREL__ENDPOINTS__GRPC__PROTOCOLS=Http2
      - KESTREL__ENDPOINTS__HTTP__URL=http://createorderservice:${HTTP_PORT}
      - KESTREL__ENDPOINTS__HTTP__PROTOCOLS=Http1
      - CONNECTIONSTRINGS__POSTGRES=${RWSQLCONNECTION}
      - RABBITMQ__HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
    networks:
      - patroni-net
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gatewayservice:
    build:
      context: .
      dockerfile: ./GatewayService/Dockerfile
    image: registry.eatx.pk/online-order-taking/gatewayservice:latest
    ports:
      - "8090:8080"
    environment:
      - GRPC__PUSHNOTIFICAIONHOST=http://pushnotificationservice:${GRPC_PORT}
      - GRPC__ORDERHISTORYHOST=http://orderhistoryservice:${GRPC_PORT}
      - GRPC__GENERALSEODATAHOST=http://generalseodataservice:${GRPC_PORT}
      - GRPC__CREATEORDERHOST=http://createorderservice:${GRPC_PORT}
      - ASPNETCORE_ENVIRONMENT=${GATEWAY_ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${GATEWAY_ASPNETCORE_URLS}
      - REDIS__CONNECTIONSTRING=${REDIS_HOST}:${REDIS_PORT},password=${REDIS_PASSWORD},abortConnect=false
      - RABBITMQ__HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - JWT__KEY=${GATEWAY_JWT_KEY}
      - JWT__ISSUER=${GATEWAY_JWT_ISSUER}
      - JWT__AUDIENCE=${GATEWAY_JWT_AUDIENCE}
      - JWT__EXPIREMINUTES=${GATEWAY_JWT_EXPIREMINUTES}
    networks:
      - patroni-net
    depends_on:
      rabbitmq:
        condition: service_healthy

networks:
  patroni-net:
    driver: bridge