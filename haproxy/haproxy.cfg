global
    log stdout local0 debug
    maxconn 1000

defaults
    mode tcp
    timeout connect 5s
    timeout client 10s
    timeout server 10s
    option tcplog
    log global

# Read-Write (primary only) entry point used by your microservice
frontend pg_rw
    bind *:5433
    default_backend bk_pg_rw

# Optional: Read-Only entry point for reporting/analytics clients
# Expose/forward 5433 in docker-compose if you plan to use this.
frontend pg_ro
    # Use a separate port for read-only connections so the microservice's
    # 5433 port always goes to the read-write frontend (primary).
    bind *:5434
    default_backend bk_pg_ro

# Backend for write operations (route only to Patroni-elected primary)
backend bk_pg_rw
    mode tcp
    # Ask Patroni REST API on each node if it is the primary
    option httpchk GET /primary
    http-check expect status 200
    # Fast role change reaction, avoid DNS issues at startup
    default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions init-addr last,libc,none
    # Data path on 5433, health checks on Patroni port 8008
    server patroni1 patroni1:5433 maxconn 100 check port 8008
    server patroni2 patroni2:5433 maxconn 100 check port 8008
    server patroni3 patroni3:5433 maxconn 100 check port 8008

# Backend for read operations (route only to replicas)
backend bk_pg_ro
    mode tcp
    balance roundrobin
    # Ask Patroni REST API on each node if it is a replica
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions init-addr last,libc,none
    server patroni1 patroni1:5433 maxconn 100 check port 8008
    server patroni2 patroni2:5433 maxconn 100 check port 8008
    server patroni3 patroni3:5433 maxconn 100 check port 8008

# HAProxy stats UI
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 30s
    stats show-legends

